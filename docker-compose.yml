services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: roomalloc
      POSTGRES_PASSWORD: roomalloc
      POSTGRES_DB: roomalloc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomalloc -d roomalloc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
